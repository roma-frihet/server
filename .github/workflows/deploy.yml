name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 배포 환경
        type: choice
        options:
          - production
          - development
        default: production
  # development 서버를 만든 뒤 주석을 풀면 develop에 push할 때마다 자동 배포된다.
  # push:
  #   branches: [develop]

permissions:
  contents: read
  id-token: write # Workload Identity Federation으로 GCP에 인증한다

concurrency:
  group: deploy-${{ inputs.environment || 'development' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 값은 GitHub Environment별 변수에서 읽는다. production 환경은 승인자와 production 브랜치로 보호한다.
    environment:
      name: ${{ inputs.environment || 'development' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/server:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: 검사와 빌드
        run: ./gradlew check bootJar

      - name: 실행 jar 준비
        run: cp "$(find build/libs -name '*.jar' ! -name '*-plain.jar')" build/libs/app.jar

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: 이미지 빌드와 푸시
        run: |
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # 비밀값은 GCP Secret Manager에서 주입하고, 이름은 서비스명으로 구분한다.
      # Flyway가 기동 중에 실패하면 새 리비전이 뜨지 않아 이전 리비전이 계속 트래픽을 받는다.
      - name: Cloud Run 배포
        id: deploy
        env:
          RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
          MAX_INSTANCES: ${{ vars.CLOUD_RUN_MAX_INSTANCES || '2' }}
          DB_URL: ${{ vars.DB_URL }}
          DB_USERNAME: ${{ vars.DB_USERNAME }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "$IMAGE" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --cpu-boost \
            --min-instances 0 \
            --max-instances "$MAX_INSTANCES" \
            --set-env-vars "^|^SPRING_PROFILES_ACTIVE=prod|DB_URL=$DB_URL|DB_USERNAME=$DB_USERNAME|SUPABASE_URL=$SUPABASE_URL" \
            --set-secrets "DB_PASSWORD=$SERVICE-db-password:latest,SUPABASE_SERVICE_ROLE_KEY=$SERVICE-supabase-service-role-key:latest"

          url=$(gcloud run services describe "$SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format 'value(status.url)')
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: 헬스 체크
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "${{ steps.deploy.outputs.url }}/actuator/health"
