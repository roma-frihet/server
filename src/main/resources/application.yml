spring:
  application:
    name: server
  config:
    # 프로젝트 루트의 .env 파일을 속성으로 읽는다(없으면 무시)
    import: optional:file:.env[.properties]
  profiles:
    default: local

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # 스키마 기준은 Flyway
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          time_zone: Asia/Seoul

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Supabase 기본 스키마(public)에 이력 테이블을 만든다
    schemas: public

app:
  security:
    supabase-url: ${SUPABASE_URL}
    jwt-secret: ${SUPABASE_JWT_SECRET:}
    audience: authenticated
  storage:
    supabase-url: ${app.security.supabase-url}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    bucket: question-images
    signed-url-ttl-seconds: 600

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info
